volumes:
  mysql_data:
  pipeline_scripts:
  pipeline_build_logs:

networks:
  app:
  autobuild_loki:
    external: true
  autobuild_prometheus:
    external: true

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: pipeline
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
      - autobuild_loki
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  auth-service:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: auth-service
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: ${DB}
      KC_DB_URL: ${DB_URL}
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HEALTH_ENABLED: true
    ports:
      - "8180:8080"
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json
    networks:
      - app
      - autobuild_loki
    depends_on:
      mysql-db:
        condition: service_healthy
  pipeline-app:
    image: pipeline-app
    container_name: pipeline-app
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_HOST: auth-service
      AUTH_PORT: 8080
      OTEL_SERVICE_NAME: pipeline-app
      # Point out of the container to the alloy service name
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Prometheus already scrapes metrics via /actuator/prometheus — disable OTLP metrics to avoid duplication
      OTEL_METRICS_EXPORTER: none
    ports:
      - "8080:8080"
    volumes:
      - pipeline_scripts:/app/pipeline_scripts
      - pipeline_build_logs:/app/pipeline_build_logs
    networks:
      - app
      - autobuild_loki
      - autobuild_prometheus
    depends_on:
      mysql-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy