name: Setup Dependencies for building AutoBuild
description: Composite actions for setting up dependencies for building AutoBuild

inputs:
  java-version:
    required: true
    description: Version of java to be setup in CI
  node-version:
    required: true
    description: Version of node and npm to be setup in CI

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
        cache: maven
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
        cache: maven
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}
        # Share repository cache between workflows.
        repository-cache: true
