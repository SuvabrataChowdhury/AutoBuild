name: AutoBuild CI

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]

jobs:
  central-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          java-version: "17"
          node-version: "22"

      - name: Pipeline Service Validation
        id: pipeline-service-validation
        run: bazel test //pipeline:test --test_output=all

      - name: Check for OpenAPI contract violation
        id: is_openapi_contract_violated
        uses: ./.github/actions/openapi-changes
        with:
          base-ref: ${{github.base_ref}}
          has-pipeline-validations-executed: ${{steps.pipeline-service-validation.outputs.has_executed}}
      
      - name: Pipeline UI Validation
        id: pipeline-ui-validation
        run: bazel test //pipeline-ui:test --test_output=all
