networks:
  autobuild_loki:
    external: true
  autobuild_prometheus:
    external: true

services:
  mysql-db:
    networks:
      - autobuild_loki

  auth-service:
    environment:
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://alloy:4317
      KC_TRACING_PROTOCOL: grpc
    networks:
      - autobuild_loki
    depends_on:
      alloy:
        condition: service_started

  pipeline-app:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: otlp
    networks:
      - autobuild_loki
      - autobuild_prometheus
    depends_on:
      alloy:
        condition: service_started
