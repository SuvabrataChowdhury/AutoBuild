apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: "http://loki:3100"
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: "http://prometheus:9090"
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
  - name: Alertmanager
    type: alertmanager
    access: proxy
    orgId: 1
    url: "http://alertmanager:9093"
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: true
